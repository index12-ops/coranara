<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corazón</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
const layer = document.createElement('canvas'), lx = layer.getContext('2d');
let W, H, S, dpr, tt, rot, last;

const GIRO = 0.7;
const INTRO = 4;
const FORMA = 10;
const DELTA_MAX = 0.9;
const HUE_INICIO = 330;
const HUE_RANGO = 60;

const suave = t => t * t * (3 - 2 * t);

function corazon(t, esc) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return [W / 2 + x * S * esc, H / 2 - (y + 2.5) * S * esc];
}

function linea() {
  let esc = 1, delta = 0.04;
  if (tt < INTRO) {
    esc = 0.03 + 0.97 * suave(tt / INTRO);
  } else {
    delta = 0.04 + (DELTA_MAX - 0.04) * suave(Math.min((tt - INTRO) / FORMA, 1));
  }
  return [corazon(rot, esc), corazon(rot + delta, esc)];
}

function reiniciar() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = layer.width = W * dpr;
  c.height = layer.height = H * dpr;
  S = Math.min(W, H) / 40;
  lx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tt = 0; rot = 0; last = performance.now();
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  tt += dt;

  const avance = GIRO * Math.PI * 2 * dt;
  const pasos = Math.max(1, Math.ceil(avance / 0.04));
  for (let k = 0; k < pasos; k++) {
    rot += avance / pasos;
    if (tt >= INTRO && tt < INTRO + FORMA) {
      const [a, b] = linea();
      const p = (tt - INTRO) / FORMA;
      const hue = (HUE_INICIO + HUE_RANGO * p) % 360;
      lx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.4)`;
      lx.lineWidth = 1;
      lx.beginPath(); lx.moveTo(a[0], a[1]); lx.lineTo(b[0], b[1]); lx.stroke();
    }
  }

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(layer, 0, 0, W, H);

  const [a, b] = linea();
  ctx.save();
  ctx.globalAlpha = Math.min(1, tt * 2);
  ctx.shadowColor = '#ff2d6f'; ctx.shadowBlur = 16;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.restore();

  requestAnimationFrame(frame);
}
addEventListener('resize', reiniciar);
addEventListener('click', reiniciar);
reiniciar(); requestAnimationFrame(frame);
</script>
</body>
</html>
